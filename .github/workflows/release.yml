name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual (re)publish of an EXISTING tag. A tag-only trigger cannot be
  # retried after a workflow bug: `gh run rerun` re-executes the workflow
  # DEFINITION the tag was pushed under, so a fix on main never applies, and
  # re-tagging would rewrite published history. v0.1.3-alpha needed exactly
  # this after the pg_config bug below.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build, e.g. v0.1.3-alpha'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg_version: [18]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y libopenblas-dev libreadline-dev zlib1g-dev pkg-config

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version 0.17.0 --locked

      - name: Initialize pgrx
        run: cargo pgrx init --pg${{ matrix.pg_version }} download

      - name: Build extension (release)
        run: |
          # NOT `which pg_config`: that finds the runner's preinstalled
          # PostgreSQL (16), and pgrx derives the feature name from the
          # pg_config it is given, so it then demands a `pg16` feature this
          # crate does not declare. Use the install pgrx just built.
          shopt -s nullglob
          cfgs=($HOME/.pgrx/${{ matrix.pg_version }}.*/pgrx-install/bin/pg_config)
          if [ ${#cfgs[@]} -ne 1 ]; then
            echo "::error::expected exactly one pgrx pg_config for PG ${{ matrix.pg_version }}, found ${#cfgs[@]}: ${cfgs[*]:-none}"
            exit 1
          fi
          echo "using ${cfgs[0]} ($(${cfgs[0]} --version))"
          cargo pgrx package --pg-config "${cfgs[0]}"

      - name: Package artifact
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"; VERSION="${TAG#v}"
          ARTIFACT="pg_infer-${VERSION}-pg${{ matrix.pg_version }}-x86_64-linux"
          mkdir -p "${ARTIFACT}"
          cp -r target/release/pg_infer-pg${{ matrix.pg_version }}/* "${ARTIFACT}/" 2>/dev/null || true
          tar czf "${ARTIFACT}.tar.gz" "${ARTIFACT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg_infer-pg${{ matrix.pg_version }}-x86_64-linux
          path: pg_infer-*.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Without an explicit tag_name this attaches to github.ref, which on a
          # workflow_dispatch run is the BRANCH, not the release tag.
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            *.tar.gz

  # Queue a postgresql.org news article for moderation (never auto-published;
  # see ci/announce.sh). Patch releases are skipped by the script unless their
  # changes carry a "### Security" section.
  announce:
    name: Announce to PostgreSQL news/announce
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # announce.sh reads the commits since the previous tag
          ref: ${{ inputs.tag || github.ref }}
      - name: Announce to PostgreSQL news/announce
        env:
          PGORG_USER: ${{ secrets.PGORG_USER }}
          PGORG_PASSWORD: ${{ secrets.PGORG_PASSWORD }}
          PGORG_ORG_ID: ${{ secrets.PGORG_ORG_ID }}
          PGORG_EMAIL_ID: ${{ secrets.PGORG_EMAIL_ID }}
          PGORG_TAGS: ${{ secrets.PGORG_TAGS }}
        run: |
          if [ -z "$PGORG_USER" ] || [ -z "$PGORG_PASSWORD" ]; then
            echo "PGORG_USER/PGORG_PASSWORD secrets not set; skipping announcement."
            exit 0
          fi
          TAG="${{ inputs.tag || github.ref_name }}"; bash ci/announce.sh "${TAG#v}"
