name: pgxn-release

# Publish the tagged release to PGXN. Needs the PGXN_USERNAME and
# PGXN_PASSWORD repository secrets (a https://manager.pgxn.org account);
# without them the job skips instead of failing.
#
# This runs on the GitHub mirror only. Codeberg does not upload to PGXN,
# so each version is uploaded exactly once.
#
# The install SQL (sql/pg_infer--<version>.sql) is committed, so the
# source distribution is a plain git archive of the tag; no pgrx toolchain
# is needed.  It is a SOURCE archive: users build with cargo pgrx.

on:
  push:
    tags: ['v*']

jobs:
  pgxn:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if PGXN secrets are not set
        id: check
        env:
          PGXN_USERNAME: ${{ secrets.PGXN_USERNAME }}
          PGXN_PASSWORD: ${{ secrets.PGXN_PASSWORD }}
        run: |
          if [ -z "$PGXN_USERNAME" ] || [ -z "$PGXN_PASSWORD" ]; then
            echo "::notice::PGXN_USERNAME/PGXN_PASSWORD not set; skipping PGXN upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Check versions match the tag
        if: steps.check.outputs.skip != 'true'
        run: |
          VER="${GITHUB_REF_NAME#v}"
          META_VER="$(jq -r .version META.json)"
          CARGO_VER="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          CTL_VER="$(sed -n "s/^default_version *= *'\(.*\)'/\1/p" pg_infer.control)"
          for v in "$META_VER" "$CARGO_VER" "$CTL_VER"; do
            if [ "$v" != "$VER" ]; then
              echo "::error::tag $VER, META.json $META_VER, Cargo.toml $CARGO_VER, pg_infer.control $CTL_VER"
              exit 1
            fi
          done
          test -f "sql/pg_infer--${VER}.sql" || {
            echo "::error::sql/pg_infer--${VER}.sql is missing"; exit 1; }

      - name: Build distribution
        if: steps.check.outputs.skip != 'true'
        run: |
          VER="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="pg_infer-${VER}/" \
            -o "pg_infer-${VER}.zip" "$GITHUB_REF_NAME"

      - name: Upload to PGXN
        if: steps.check.outputs.skip != 'true'
        env:
          PGXN_USERNAME: ${{ secrets.PGXN_USERNAME }}
          PGXN_PASSWORD: ${{ secrets.PGXN_PASSWORD }}
        run: |
          archive="pg_infer-${GITHUB_REF_NAME#v}.zip"
          # 2xx/3xx: accepted.  409: this version is already on PGXN.
          code=$(curl -sS -o /tmp/pgxn_resp.txt -w '%{http_code}' \
            --user "$PGXN_USERNAME:$PGXN_PASSWORD" \
            -F "archive=@${archive};type=application/zip" \
            https://manager.pgxn.org/upload)
          echo "PGXN upload HTTP $code"; cat /tmp/pgxn_resp.txt || true
          case "$code" in
            2*|3*) echo "PGXN upload accepted." ;;
            409)   echo "::warning::this version is already on PGXN." ;;
            *)     echo "::error::PGXN upload failed (HTTP $code)"; exit 1 ;;
          esac
