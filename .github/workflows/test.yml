name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-workspace:
    name: Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install OpenBLAS
        run: sudo apt-get update -qq && sudo apt-get install -y libopenblas-dev libreadline-dev zlib1g-dev pkg-config

      - name: Run workspace tests (excluding pg_infer extension)
        run: cargo test --workspace --exclude pg_infer

  test-pgrx:
    name: pgrx Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y libopenblas-dev libreadline-dev zlib1g-dev pkg-config

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version 0.17.0 --locked

      - name: Initialize pgrx (PostgreSQL 18)
        run: cargo pgrx init --pg18 download

      - name: Run pgrx tests
        run: |
          # Swatinem/rust-cache restores target/, and pgrx puts its test cluster
          # in target/test-pgdata/<ver>. A cached datadir from an earlier run is
          # not a valid cluster -- PG_VERSION and friends are not cache-restored
          # faithfully -- so pg_ctl start fails with "is not a database cluster
          # directory", the first test hard-aborts holding the test mutex, and
          # every remaining test reports "Could not obtain test mutex". That is
          # why the first run after adding the cache passed and every later one
          # failed on identical code. Start from a clean datadir; pgrx initdb's
          # it in seconds.
          rm -rf target/test-pgdata
          cargo pgrx test pg18
