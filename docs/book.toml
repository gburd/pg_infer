[book]
authors = ["Greg Burd"]
language = "en"
multilingual = false
src = "src"
title = "pg_infer Documentation"

[build]
build-dir = "book"

[output.html]
default-theme = "rust"
preferred-dark-theme = "coal"
# This book documents pg_infer, so the "edit this page" link belongs on
# pg_infer's own repository. It previously pointed at the larql fork,
# which sent every doc-fix contributor to the wrong project.
git-repository-url = "https://codeberg.org/gregburd/pg_infer"
